project_id = "vayora"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
port = 54322
major_version = 17
[db.seed]
enabled = false
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["com.vayora.app://login-callback", "http://localhost:3000/invite", "https://vayora-eta.vercel.app/invite"]
enable_anonymous_sign_ins = true
enable_manual_linking = true
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
[storage]
enabled = true
file_size_limit = "50MiB"
[functions.delete-account]
verify_jwt = false

[functions.admin-delete-account]
verify_jwt = false

[functions.admin-invite]
verify_jwt = false

[functions.upi-webhook]
verify_jwt = false

[functions.cloud-files]
verify_jwt = false

[functions.post-delete]
verify_jwt = false

[functions.play-verify]
verify_jwt = false

[functions.play-report]
verify_jwt = false

[functions.provider-payment]
verify_jwt = false
