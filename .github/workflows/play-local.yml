name: Temporary local Play AAB
on:
  push:
    branches: [fix/play-package-id]
    paths: [.github/workflows/play-local.yml]
permissions:
  contents: read
concurrency:
  group: temporary-local-play
  cancel-in-progress: false
jobs:
  play:
    if: github.repository == 'smitkhachariya2002-collab/Vayora'
    runs-on: [self-hosted, Windows, X64, vayora-play-temp]
    environment: production
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'vayora' }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 57dad203c4185c50a3a576b8f338a6b5363af692
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install required Android packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: false
      - name: Restore the permanent signing key without displaying secrets
        run: |
          if (!$env:ANDROID_KEYSTORE_BASE64 -or !$env:ANDROID_KEYSTORE_PASSWORD) { throw "Permanent signing secrets are missing" }
          [IO.File]::WriteAllBytes("$pwd/mobile/android/app/release.jks", [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          python -c "import json,os; c=json.load(open('mobile/config/public.json')); c.update({k:os.environ[k] for k in ['SUPABASE_URL','SUPABASE_KEY'] if os.environ.get(k)}); assert c['SUPABASE_KEY'].startswith('sb_publishable_'); json.dump(c,open('mobile/local-defines.json','w'))"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Resolve locked packages
        working-directory: mobile
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build signed Play AAB
        working-directory: mobile
        run: |
          flutter build appbundle --release --flavor play --dart-define-from-file=local-defines.json --dart-define=PLAY_STORE=true --dart-define=ANDROID_APP_ID=com.vayora.play
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory artifacts -Force | Out-Null
          Copy-Item build/app/outputs/bundle/playRelease/app-play-release.aab artifacts/Vayora-play.aab
      - name: Verify actual AAB package, version, manifest and signature
        working-directory: mobile
        run: |
          $jar = "$env:RUNNER_TEMP/bundletool.jar"
          Invoke-WebRequest https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -OutFile $jar
          if ((Get-FileHash $jar -Algorithm SHA256).Hash -ne 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29') { throw "Bundletool checksum mismatch" }
          java -jar $jar dump manifest --bundle=artifacts/Vayora-play.aab --module=base | Set-Content -Encoding utf8 artifacts/Play-AndroidManifest.xml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $package = java -jar $jar dump manifest --bundle=artifacts/Vayora-play.aab --xpath='/manifest/@package'
          $code = java -jar $jar dump manifest --bundle=artifacts/Vayora-play.aab --xpath='/manifest/@android:versionCode'
          if ($package.Trim() -ne 'com.vayora.play' -or $code.Trim() -ne '11') { throw "Wrong AAB identity" }
          "bundletool: package=$package versionCode=$code" | Tee-Object artifacts/PACKAGE-IDENTITY.txt
          python tool/verify_app_identity.py artifacts/Play-AndroidManifest.xml com.vayora.play 11
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tool/verify_upi_manifest.py artifacts/Play-AndroidManifest.xml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          jarsigner -verify artifacts/Vayora-play.aab
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          keytool -list -v -keystore android/app/release.jks -storepass:env ANDROID_KEYSTORE_PASSWORD -alias $env:ANDROID_KEY_ALIAS | Select-String 'SHA256:' | Set-Content artifacts/SIGNING-CERT.txt
          $hash = (Get-FileHash artifacts/Vayora-play.aab -Algorithm SHA256).Hash.ToLower()
          "$hash  Vayora-play.aab" | Set-Content artifacts/SHA256SUMS.txt
          Get-Content artifacts/PACKAGE-IDENTITY.txt | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Enable exact Android auth callbacks while preserving other settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python scripts/configure_android_callbacks.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Deploy corrected Play package endpoints
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy --help | Out-Null
          supabase functions deploy play-verify --project-ref fzloulsjhkdxwagonsgt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          supabase functions deploy play-report --project-ref fzloulsjhkdxwagonsgt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Vayora-Play-AAB
          path: mobile/artifacts/*
          retention-days: 7
          if-no-files-found: error
      - name: Remove signing material and temporary configuration
        if: always()
        run: |
          Remove-Item -LiteralPath mobile/android/app/release.jks,mobile/local-defines.json -Force -ErrorAction SilentlyContinue
