name: Database security tests
on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/sql-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Confirm CLI interfaces
        run: |
          supabase start --help > /dev/null
          supabase test db --help > /dev/null
      - run: supabase start
      - name: Run database advisors against the disposable database
        run: |
          supabase db advisors --help > /dev/null
          supabase db advisors --local
      - run: supabase test db
      - name: Verify real guest conversion and email callbacks
        run: |
          supabase status --help > /dev/null
          supabase status --output json > /tmp/vayora-local-status.json
          node supabase/tests/auth_flow.mjs /tmp/vayora-local-status.json
      - if: always()
        run: supabase stop --no-backup
