name: Deploy reviewed Supabase migrations
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Check configuration without printing secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }
          test "$SUPABASE_PROJECT_REF" = "fzloulsjhkdxwagonsgt" || { echo "Wrong project ref"; exit 1; }
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push
      - run: supabase functions deploy delete-account --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase functions deploy admin-delete-account --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase functions deploy admin-invite --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy the reviewed payment, cloud and Play functions
        run: |
          supabase functions deploy upi-webhook --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy cloud-files --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy post-delete --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy play-verify --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy play-report --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase migration list
