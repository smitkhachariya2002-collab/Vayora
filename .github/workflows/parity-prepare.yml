name: Prepare reviewed migration
on:
  pull_request:
    paths: ['supabase/changes/*.sql']
permissions:
  contents: read
concurrency:
  group: parity-migration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: (github.head_ref == 'build/flixvault-parity' || github.head_ref == 'build/live-plan-management') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Generate migration using the CLI
        run: |
          supabase migration new --help
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,time
          for source in sorted(Path('supabase/changes').glob('*.sql')):
              old=set(Path('supabase/migrations').glob('*.sql'))
              subprocess.run(['supabase','migration','new',source.stem],check=True)
              created=set(Path('supabase/migrations').glob('*.sql'))-old
              assert len(created)==1
              target=created.pop()
              target.write_text(source.read_text())
              source.unlink()
              time.sleep(1)
          PY
      - name: Save generated migration
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          git fetch origin "$PR_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations supabase/changes
          if ! git diff --cached --quiet; then
            git commit -m "Generate reviewed parity migration"
            git push origin "HEAD:$PR_BRANCH"
          fi
