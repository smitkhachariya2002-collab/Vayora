name: Edge Function verification
on:
  pull_request:
    paths: ['supabase/functions/**', '.github/workflows/functions.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4
      - name: Type-check every deployed Edge Function
        run: deno check supabase/functions/*/index.ts

      - name: Verify provider HMAC boundary
        run: deno test supabase/functions/provider-payment/handler_test.ts

      - name: Verify public deletion request boundary
        run: deno test supabase/functions/deletion-request/handler_test.ts
