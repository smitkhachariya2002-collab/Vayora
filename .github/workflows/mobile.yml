name: Android verification and APKs
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Install locked dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter build apk --debug
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: Vayora-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
  release:
    needs: verify
    if: github.event_name != 'pull_request' && vars.ANDROID_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore fixed release signing key without logging it
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_KEY"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/android/app/release.jks
          python3 - <<'PY'
          import json, os
          with open('/tmp/vayora-defines.json','w') as out:
              json.dump({k:os.environ[k] for k in ['SUPABASE_URL','SUPABASE_KEY']},out)
          PY
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - name: Build both release APKs
        working-directory: mobile
        run: |
          mkdir -p artifacts
          flutter build apk --release --dart-define-from-file=/tmp/vayora-defines.json
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/Vayora.apk
          flutter build apk --release --dart-define-from-file=/tmp/vayora-defines.json --dart-define='APK_REFERRER=utm_source=meta&utm_medium=paid_social&utm_campaign=apk_download'
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/Vayora-ads.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Vayora-apks
          path: mobile/artifacts/*.apk
      - if: always()
        run: rm -f mobile/android/app/release.jks /tmp/vayora-defines.json
