name: Android verification and APKs
on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Install locked dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Regenerate branding from committed SVG sources before Android builds
        working-directory: mobile
        run: |
          pip install cairosvg==2.7.1 Pillow==11.1.0
          python3 tool/export_branding.py
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Verify centralised visual tokens
        run: python3 tool/check_visual_tokens.py
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
      - name: Verify Play UI hides purchases while disabled
        working-directory: mobile
        run: flutter test test/play_distribution_test.dart --dart-define=PLAY_STORE=true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: mobile/android/**/*.gradle*
      - name: Verify native Android compilation
        working-directory: mobile
        run: flutter build apk --debug --flavor direct --target-platform android-arm64 --dart-define-from-file=config/public.json
      - name: Test native discovery for arbitrary UPI app packages
        working-directory: mobile/android
        run: ./gradlew :app:testDirectDebugUnitTest -Pandroid.enableJetifier=false
      - name: Verify installed-app visibility in the compiled Android manifest
        working-directory: mobile
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print build/app/outputs/flutter-apk/app-direct-debug.apk > /tmp/vayora-manifest.xml
          python3 tool/verify_upi_manifest.py /tmp/vayora-manifest.xml
      - name: Build offline x64 APK for the disposable branding emulator
        if: github.head_ref == 'ui/royal-violet'
        working-directory: mobile
        run: flutter build apk --debug --flavor direct --target-platform android-x64
      - name: Save debug APK for native branding evidence
        if: github.head_ref == 'ui/royal-violet'
        uses: actions/upload-artifact@v4
        with:
          name: Vayora-visual-debug
          path: mobile/build/app/outputs/flutter-apk/app-direct-debug.apk
          retention-days: 2

  native-branding:
    needs: verify
    if: github.head_ref == 'ui/royal-violet'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/royal-violet
          fetch-depth: 0
      - name: Check existing reviewed native captures
        id: capture
        run: |
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          sources=sorted(Path('mobile/assets/branding').glob('*.svg'))+[Path('mobile/flutter_native_splash.yaml')]
          current=hashlib.sha256(b''.join(p.read_bytes() for p in sources)).hexdigest()
          saved=Path('docs/visual-refresh/native/source-hash.txt')
          valid=saved.exists() and saved.read_text()==current
          valid=valid and Path('docs/visual-refresh/native/launcher-home-preview.png').exists()
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('needed='+str(not valid).lower()+'\n')
          PY
      - uses: actions/download-artifact@v4
        if: steps.capture.outputs.needed == 'true'
        with:
          name: Vayora-visual-debug
          path: visual-apk
      - name: Prepare capture tools and emulator acceleration
        if: steps.capture.outputs.needed == 'true'
        run: |
          pip install Pillow==11.1.0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        if: steps.capture.outputs.needed == 'true'
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          script: python3 mobile/tool/capture_android_branding.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.capture.outputs.needed == 'true'
        with:
          name: Vayora-native-branding
          path: docs/visual-refresh/native
          retention-days: 7
      - name: Include native evidence in the third commit only
        if: steps.capture.outputs.needed == 'true'
        env:
          PR_BRANCH: ui/royal-violet
        run: |
          EXPECTED_SHA=$(git rev-parse HEAD)
          git fetch origin "$PR_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual-refresh/native
          git commit --amend --no-edit
          git push --force-with-lease="refs/heads/$PR_BRANCH:$EXPECTED_SHA" origin "HEAD:$PR_BRANCH"

  release:
    needs: verify
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'build/flixvault-parity' || github.head_ref == 'build/reliable-upi' || github.head_ref == 'fix/upi-app-discovery' || github.head_ref == 'fix/upi-order-window' || github.head_ref == 'ui/profile-plans-first' || github.head_ref == 'fix/cloud-upi-options' || github.head_ref == 'ui/royal-violet' || github.head_ref == 'fix/upi-launch-fallback' || github.head_ref == 'fix/play-package-name' || github.head_ref == 'feature/admin-live-controls-v12' || github.head_ref == 'fix/version-label'))
    runs-on: ubuntu-latest
    environment: production
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'vayora' }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check signing secrets before installing build tools
        run: |
          missing=0
          if test -z "$ANDROID_KEYSTORE_BASE64"; then echo "Missing repository secret ANDROID_KEYSTORE_BASE64"; missing=1; fi
          if test -z "$ANDROID_KEYSTORE_PASSWORD"; then echo "Missing repository secret ANDROID_KEYSTORE_PASSWORD"; missing=1; fi
          test "$missing" = 0
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: mobile/android/**/*.gradle*
      - name: Verify the existing permanent key
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Save the permanent Android signing secrets first. No temporary key will be created."; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/android/app/release.jks
          keytool -list -v -keystore mobile/android/app/release.jks -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS"
          python3 - <<'PY'
          import json,os
          config=json.load(open('mobile/config/public.json'))
          for name in ['SUPABASE_URL','SUPABASE_KEY']:
              if os.environ.get(name): config[name]=os.environ[name]
          if not config['SUPABASE_KEY'].startswith('sb_publishable_'):
              raise SystemExit('Use a publishable key, never a server key')
          json.dump(config,open('/tmp/vayora-defines.json','w'))
          PY
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - name: Verify reproducible release branding
        working-directory: mobile
        run: |
          pip install cairosvg==2.7.1 Pillow==11.1.0
          python3 tool/export_branding.py
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          git diff --exit-code -- assets/branding android/app/src/main/res android/app/src/main/AndroidManifest.xml ../admin/public ../docs/store
      - name: Build signed normal, ads and Play artifacts
        working-directory: mobile
        run: |
          mkdir -p artifacts
          flutter build apk --release --flavor direct --target-platform android-arm,android-arm64 --dart-define-from-file=/tmp/vayora-defines.json
          cp build/app/outputs/flutter-apk/app-direct-release.apk artifacts/Vayora.apk
          flutter build apk --release --flavor direct --target-platform android-arm,android-arm64 --dart-define-from-file=/tmp/vayora-defines.json --dart-define='APK_REFERRER=utm_source=meta&utm_medium=paid_social&utm_campaign=apk_download'
          cp build/app/outputs/flutter-apk/app-direct-release.apk artifacts/Vayora-ads.apk
          flutter build appbundle --release --flavor play --dart-define-from-file=/tmp/vayora-defines.json --dart-define=PLAY_STORE=true --dart-define=ANDROID_APP_ID=com.vayora.play
          cp build/app/outputs/bundle/playRelease/app-play-release.aab artifacts/Vayora-play.aab
      - name: Verify UPI visibility in every release flavor
        working-directory: mobile
        run: |
          for apk in artifacts/Vayora.apk artifacts/Vayora-ads.apk; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$apk" > /tmp/vayora-release-manifest.xml
            python3 tool/verify_upi_manifest.py /tmp/vayora-release-manifest.xml
          done
          python3 - <<'PY'
          import glob, subprocess
          for flavor in ['directRelease', 'playRelease']:
              paths=glob.glob(f'build/app/intermediates/merged_manifests/{flavor}/**/AndroidManifest.xml',recursive=True)
              paths+=glob.glob(f'build/app/intermediates/merged_manifest/{flavor}/**/AndroidManifest.xml',recursive=True)
              assert paths, f'No merged release manifest found for {flavor}'
              subprocess.run(['python3','tool/verify_upi_manifest.py',*paths],check=True)
              expected={'directRelease':'com.vayora.app','playRelease':'com.vayora.play'}[flavor]
              for path in paths:
                  text=open(path).read()
                  assert f'package="{expected}"' in text, f'{flavor} must use package {expected}: {path}'
                  assert f'android:scheme="{expected}"' in text, f'{flavor} login callback must use {expected}: {path}'
              print(flavor, 'package', expected)
          PY
      - name: Verify all release signatures and checksums
        working-directory: mobile
        run: |
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose --print-certs artifacts/Vayora.apk > artifacts/SIGNING-CERT.txt
          "$SIGNER" verify --verbose --print-certs artifacts/Vayora-ads.apk >> artifacts/SIGNING-CERT.txt
          jarsigner -verify artifacts/Vayora-play.aab
          keytool -list -v -keystore android/app/release.jks -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | sed -n 's/.*SHA256: /SHA256: /p' >> artifacts/SIGNING-CERT.txt
          sha256sum artifacts/*.apk artifacts/*.aab > artifacts/SHA256SUMS.txt
          cat artifacts/SIGNING-CERT.txt
          cat artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Vayora-apks
          path: |
            mobile/artifacts/*.apk
            mobile/artifacts/*.aab
            mobile/artifacts/SHA256SUMS.txt
            mobile/artifacts/SIGNING-CERT.txt
          retention-days: 7
          if-no-files-found: error
      - if: always()
        run: rm -f mobile/android/app/release.jks /tmp/vayora-defines.json
