name: Android verification and APKs
on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Install locked dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build connected testing APKs
        working-directory: mobile
        run: |
          mkdir -p test-artifacts
          flutter build apk --debug --dart-define-from-file=config/public.json
          cp build/app/outputs/flutter-apk/app-debug.apk test-artifacts/Vayora-test.apk
          flutter build apk --debug --dart-define-from-file=config/public.json --dart-define='APK_REFERRER=utm_source=meta&utm_medium=paid_social&utm_campaign=apk_download'
          cp build/app/outputs/flutter-apk/app-debug.apk test-artifacts/Vayora-ads-test.apk
          sha256sum test-artifacts/*.apk > test-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Vayora-test-apks
          path: mobile/test-artifacts/*
          retention-days: 7
          if-no-files-found: error
  release:
    needs: verify
    if: github.event_name != 'pull_request' && vars.ANDROID_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'vayora' }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore fixed release signing key without logging it
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/android/app/release.jks
          python3 - <<'PY'
          import json, os
          with open('/tmp/vayora-defines.json','w') as out:
              config = json.load(open('mobile/config/public.json'))
              for name in ['SUPABASE_URL','SUPABASE_KEY']:
                  if os.environ.get(name):
                      config[name] = os.environ[name]
              if not config['SUPABASE_KEY'].startswith('sb_publishable_'):
                  raise SystemExit('Use a modern publishable client key, never a server key')
              json.dump(config,out)
          PY
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - name: Build both release APKs
        working-directory: mobile
        run: |
          mkdir -p artifacts
          flutter build apk --release --dart-define-from-file=/tmp/vayora-defines.json
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/Vayora.apk
          flutter build apk --release --dart-define-from-file=/tmp/vayora-defines.json --dart-define='APK_REFERRER=utm_source=meta&utm_medium=paid_social&utm_campaign=apk_download'
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/Vayora-ads.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Vayora-apks
          path: mobile/artifacts/*.apk
      - if: always()
        run: rm -f mobile/android/app/release.jks /tmp/vayora-defines.json
