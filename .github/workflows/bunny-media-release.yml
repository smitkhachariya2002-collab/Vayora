name: Bunny media release 1.0.13 build 22
on:
  push:
    branches: [feature/puffle-parity-no-google-ads]
    paths: ['.github/workflows/bunny-media-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: vayora-bunny-media-22
  cancel-in-progress: true
jobs:
  build:
    uses: ./.github/workflows/v109-release.yml
    secrets: inherit
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/download-artifact@v4
        with:
          name: Vayora-v1.0.9-signed
          path: release
      - name: Verify signed artifacts and version code 22
        run: |
          cd release
          sha256sum -c checksums.txt
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          for apk in Vayora.apk Vayora-ads.apk; do
            "$signer" verify --print-certs "$apk" > "$apk.signature.txt"
            grep -qi 'c6d9bda7acafc683db399a3d879a125a05a78cbbc71bc256bfe7b76f5c35e76b' "$apk.signature.txt"
            "$aapt" dump badging "$apk" > "$apk.manifest.txt"
            grep -q "versionCode='22' versionName='1.0.13'" "$apk.manifest.txt"
          done
          jarsigner -verify Vayora-play.aab
          jarsigner -verify Vayora-play-plans.aab
          gh release download 1.18.2 --repo google/bundletool --pattern 'bundletool-all-1.18.2.jar' --dir /tmp
          test "$(java -jar /tmp/bundletool-all-1.18.2.jar dump manifest --bundle=Vayora-play.aab --xpath='/manifest/@android:versionCode')" = 22
          test "$(java -jar /tmp/bundletool-all-1.18.2.jar dump manifest --bundle=Vayora-play.aab --xpath='/manifest/@package')" = com.vayora.play
          test "$(java -jar /tmp/bundletool-all-1.18.2.jar dump manifest --bundle=Vayora-play-plans.aab --xpath='/manifest/@android:versionCode')" = 22
          test "$(java -jar /tmp/bundletool-all-1.18.2.jar dump manifest --bundle=Vayora-play-plans.aab --xpath='/manifest/@package')" = com.vayora.play
      - name: Package release and store assets
        run: |
          cp docs/META_AD_LINKS.md docs/BUNNY_SETUP.md docs/RELEASE_NOTES_1.0.13.txt release/
          cp -r play-console-assets release/
          cd release
          zip -qr Vayora-1.0.13-release.zip Vayora.apk Vayora-ads.apk Vayora-play.aab Vayora-play-plans.aab checksums.txt META_AD_LINKS.md BUNNY_SETUP.md RELEASE_NOTES_1.0.13.txt play-console-assets
      - name: Publish Vayora media build
        run: |
          cat > /tmp/release-notes.txt <<'EOF'
          Vayora 1.0.13 (version code 22).

          Prepares Bunny Stream main/trailer uploads, signed playback and bounded previews; private Bunny cloud uploads with legacy Supabase compatibility; owner storage cleanup; upload retry and payment recovery improvements. Keeps existing colors, identities, guest purchase, audience, approval and Premium rules. No Google Ads.

          Vayora.apk is the organic direct APK; Vayora-ads.apk retains explicit campaign attribution. Vayora-play.aab is the standard restricted Play build. Vayora-play-plans.aab explicitly enables PLAY_STORE=true and PLAY_SELLS_UPI=true. These are alternative bundles with the same package/version; choose one for a Play release.

          Bunny and Firebase remain configuration-deferred. Add credentials only to the existing Vayora backend and complete the provider checks in BUNNY_SETUP.md before treating media delivery as verified. Existing owner-authorized UPI response activation remains bank-unverified; customer-entered bank references are sent to review and do not activate access by themselves.
          EOF
          gh release view v1.0.13 >/dev/null 2>&1 || gh release create v1.0.13 --draft --target "$GITHUB_SHA" --title 'Vayora 1.0.13 — Media and recovery (22)' --notes-file /tmp/release-notes.txt
          gh release upload v1.0.13 release/*.apk release/*.aab release/*.zip release/*.txt release/*.md --clobber
          gh release edit v1.0.13 --draft=false --latest --notes-file /tmp/release-notes.txt
