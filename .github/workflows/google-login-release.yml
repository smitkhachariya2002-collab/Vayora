name: Google login release 1.0.11 build 20
on:
  push:
    branches: [feature/puffle-parity-no-google-ads]
    paths: ['.github/workflows/google-login-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: vayora-google-login-20
  cancel-in-progress: true
jobs:
  build:
    uses: ./.github/workflows/v109-release.yml
    secrets: inherit
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/download-artifact@v4
        with:
          name: Vayora-v1.0.9-signed
          path: release
      - name: Verify signed artifacts and version code 20
        run: |
          cd release
          sha256sum -c checksums.txt
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          for apk in Vayora.apk Vayora-ads.apk; do
            "$signer" verify --print-certs "$apk" > "$apk.signature.txt"
            grep -qi 'c6d9bda7acafc683db399a3d879a125a05a78cbbc71bc256bfe7b76f5c35e76b' "$apk.signature.txt"
            "$aapt" dump badging "$apk" > "$apk.manifest.txt"
            grep -q "versionCode='20' versionName='1.0.11'" "$apk.manifest.txt"
          done
          jarsigner -verify Vayora-play.aab
          gh release download 1.18.2 --repo google/bundletool --pattern 'bundletool-all-1.18.2.jar' --dir /tmp
          test "$(java -jar /tmp/bundletool-all-1.18.2.jar dump manifest --bundle=Vayora-play.aab --xpath='/manifest/@android:versionCode')" = 20
          test "$(java -jar /tmp/bundletool-all-1.18.2.jar dump manifest --bundle=Vayora-play.aab --xpath='/manifest/@package')" = com.vayora.play
      - name: Publish Google login build
        run: |
          cat > /tmp/release-notes.txt <<'EOF'
          Vayora 1.0.11 (version code 20).

          Google login now opens the system browser with PKCE and returns to the correct direct or Play app. New-account and premium guest saving link Google to the existing guest account so its plan and files are retained. Existing Google identities are not silently switched during guest saving. Email/password sign-in, plans and UPI remain available. Google Ads is excluded.

          Automated app checks and signing checks run before publication. Live Google authorization endpoints were checked for both app return URLs. Final Google account consent and phone callback need a real-device check; a Play Console review outcome is not guaranteed.
          EOF
          gh release view v1.0.11 >/dev/null 2>&1 || gh release create v1.0.11 --draft --target "$GITHUB_SHA" --title 'Vayora 1.0.11 — Google login (20)' --notes-file /tmp/release-notes.txt
          gh release upload v1.0.11 release/* --clobber
          gh release edit v1.0.11 --draft=false --latest --notes-file /tmp/release-notes.txt

