name: Mobile visual review
on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-visual.yml']
permissions:
  contents: read
concurrency:
  group: mobile-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshots:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: after
      - uses: actions/checkout@v4
        with:
          ref: b48dca986eb169d9705240be3c508d242976ff60
          path: before
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export editable artwork and generate launcher/splash resources
        id: branding
        working-directory: after/mobile
        run: |
          pip install cairosvg==2.7.1 Pillow==11.1.0
          python3 tool/export_branding.py
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          dart format lib test
          python3 tool/check_visual_tokens.py
      - name: Capture the actual previous UI with identical fictional data and fonts
        run: |
          cp after/mobile/test/mobile_screenshots_test.dart before/mobile/test/
          cp after/mobile/test/account_screenshots_test.dart before/mobile/test/
          cd before/mobile
          flutter pub get --enforce-lockfile
          find test/goldens -type f -name '*.png' -delete
          flutter test test/mobile_screenshots_test.dart test/account_screenshots_test.dart --dart-define=SCREENSHOTS=true --dart-define=BEFORE=true --update-goldens
          mkdir -p ../../after/docs/visual-refresh/before
          cp -r test/goldens/before/. ../../after/docs/visual-refresh/before/
          cp -r test/goldens/after/. ../../after/docs/visual-refresh/before/
      - name: Capture Royal Violet and verify reference goldens, accessibility and flows
        working-directory: after/mobile
        run: |
          flutter test test/mobile_screenshots_test.dart test/account_screenshots_test.dart test/parity_screenshots_test.dart test/plan_management_test.dart test/theme_widgets_test.dart --dart-define=SCREENSHOTS=true --dart-define=PLAN_SCREENSHOTS=true --update-goldens
          flutter test test/mobile_screenshots_test.dart test/account_screenshots_test.dart test/parity_screenshots_test.dart test/plan_management_test.dart test/theme_widgets_test.dart --dart-define=SCREENSHOTS=true --dart-define=PLAN_SCREENSHOTS=true
          flutter analyze
          flutter test
          mkdir -p ../../after/docs/visual-refresh/after
          cp -r test/goldens/after/. ../../after/docs/visual-refresh/after/
      - name: Enforce visual-only scope
        working-directory: after
        run: |
          git diff b48dca986eb169d9705240be3c508d242976ff60 --exit-code -- supabase mobile/lib/app_state.dart mobile/lib/upi.dart mobile/lib/screens/payment_flow.dart mobile/lib/plan_catalog.dart mobile/android/app/src/main/kotlin admin/src/app/api admin/src/app/actions.ts admin/src/lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vayora-Royal-Violet-review
          path: |
            after/docs/visual-refresh/
            after/mobile/test/failures/
            after/mobile/assets/branding/
            after/docs/store/
          retention-days: 7
      - name: Save generated assets in Part 3 without adding a fourth commit
        if: always() && github.head_ref == 'ui/royal-violet' && steps.branding.outcome == 'success'
        working-directory: after
        env:
          PR_BRANCH: ${{ github.head_ref }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$PR_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/visual-refresh/after
          cp -r mobile/test/goldens/after/. docs/visual-refresh/after/
          git add mobile/assets/branding mobile/android/app/src/main/res mobile/android/app/src/main/AndroidManifest.xml mobile/pubspec.lock mobile/lib mobile/test docs/visual-refresh docs/store admin/public
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
            git push --force-with-lease="refs/heads/$PR_BRANCH:$EXPECTED_SHA" origin "HEAD:$PR_BRANCH"
          fi
