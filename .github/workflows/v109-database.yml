name: Vayora preserving upgrade checks
on:
  push:
    branches: [feature/puffle-parity-no-google-ads]
    paths: ['supabase/**', '.github/workflows/v109-database.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: {version: 3.1.0}
      - run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - run: supabase start
      - run: python3 supabase/upgrade/verify.py
      - if: always()
        run: supabase stop --no-backup
