name: Publish complete Vayora release kit
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/package_release_kit.py
      - name: Publish verified bundle and artwork
        run: gh release upload v1.0.10 release-check/Vayora-1.0.10-Release-Kit.zip --clobber
