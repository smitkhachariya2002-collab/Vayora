name: Admin responsive review
on:
  pull_request:
    paths: ['admin/**', 'supabase/**', '.github/workflows/admin-visual.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admin-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshots:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ea95b6383bb1f3e818da1430eade7621ba38881a
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - run: supabase start
      - run: npm ci
        working-directory: admin
      - run: npm ci
        working-directory: baseline/admin
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1
        working-directory: admin
      - run: npx playwright install --with-deps chromium
        working-directory: admin
      - run: node scripts/visual-review.mjs
        working-directory: admin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-before-after
          path: admin/visual-artifacts
      - name: Realtime diagnostics on failure
        if: failure()
        run: docker logs supabase_realtime_vayora 2>&1 | grep -Ei 'error|publication|replication|subscription|wal|permission' | tail -80 || true
      - name: Save Plans review screenshots
        if: github.head_ref == 'build/live-plan-management'
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          mkdir -p docs/plan-management/admin
          cp admin/visual-artifacts/after-plans-*.png admin/visual-artifacts/plans-*.png docs/plan-management/admin/
          git fetch origin "$PR_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/plan-management/admin
          if ! git diff --cached --quiet; then
            git commit -m "Capture Plans editor and add-form review"
            git push origin "HEAD:$PR_BRANCH"
          fi
      - run: supabase stop --no-backup
        if: always()
