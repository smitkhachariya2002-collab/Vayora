name: Publish Vayora single-button consent release
on:
  push:
    branches: [feature/puffle-parity-no-google-ads]
    paths: ['.github/workflows/v110-publish.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: vayora-v110-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '43808598587'
      PUBLISH: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Require a successful signed build from this repository
        run: |
          for attempt in $(seq 1 60); do
            gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > /tmp/build.json
            if jq -e '.status == "completed"' /tmp/build.json >/dev/null; then break; fi
            sleep 30
          done
          jq -e '.conclusion == "success" and .name == "Vayora v1.0.9 candidate"' /tmp/build.json
          echo "BUILD_SHA=$(jq -r .head_sha /tmp/build.json)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: Vayora-v1.0.9-signed
          run-id: 43808598587
          github-token: ${{ github.token }}
          path: release
      - name: Verify checksums and original Vayora certificate
        working-directory: release
        run: |
          sha256sum -c checksums.txt
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for apk in Vayora.apk Vayora-ads.apk; do
            "$signer" verify --print-certs "$apk" > "$apk.signature.txt"
            grep -qi 'c6d9bda7acafc683db399a3d879a125a05a78cbbc71bc256bfe7b76f5c35e76b' "$apk.signature.txt"
          done
          jarsigner -verify Vayora-play.aab
      - name: Prepare or publish verified assets
        run: |
          if gh release view v1.0.10 --json isDraft > /tmp/release.json 2>/dev/null; then
            jq -e 'has("isDraft")' /tmp/release.json
          else
            gh release create v1.0.10 --draft --target "$GITHUB_SHA" --title 'Vayora v1.0.10' --notes 'Updated cloud storage, creator channels, video playback, purchase history and admin workspace based on Puffle v1.0.10. Existing Vayora accounts and purchases are preserved. Google Ads is excluded. Android APKs use the existing Vayora signing identity. The Play bundle is included for store submission. Signed artifacts: GitHub Actions run 43808598587.'
          fi
          gh release upload v1.0.10 release/* --clobber
          gh release edit v1.0.10 --notes "Vayora 1.0.10 build 19: one first-open Accept and continue button, no sharing switches or checkbox. Explicit notice enables analytics and Meta sharing on acceptance; no measurement starts before consent, and withdrawal remains available in Profile settings. Updated policies. Plans and UPI intent enabled in APK and AAB. Owner-requested response-based instant activation remains bank-unverified. Google Ads excluded. Play alternative-billing compliance and actual device testing remain separate. Source: $BUILD_SHA; signed build run $BUILD_RUN."
          if [ "$PUBLISH" = true ]; then gh release edit v1.0.10 --draft=false --latest; fi


      - name: Assemble complete release kit
        run: python3 tools/package_release_kit.py
      - name: Publish ZIP
        run: gh release upload v1.0.10 release-check/Vayora-1.0.10-Release-Kit.zip --clobber
