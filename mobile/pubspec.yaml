name: vayora
description: Vayora — cloud storage and creator channels.
publish_to: none
version: 1.0.9+15

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.18.3
  webview_flutter: 4.14.1
  shared_preferences: 2.5.6
  google_fonts: 6.3.3
  file_picker: 8.3.7
  url_launcher: 6.3.3
  video_player: 2.14.1
  video_thumbnail: 0.5.6
  screen_brightness: 1.0.1
  wakelock_plus: 1.3.3
  package_info_plus: 8.3.1
  share_plus: 10.1.4
  uuid: 4.6.0
  intl: 0.19.0
  flutter_dotenv: 5.2.1
  permission_handler: 11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
