name: vayora
description: Cloud storage and creator channels for India.
publish_to: none
version: 0.3.10+13
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.10.0
  shared_preferences: 2.5.3
  uuid: 4.5.1
  video_player: 2.10.0
  chewie: 1.12.1
  url_launcher: 6.3.2
  http: 1.5.0
  webview_flutter: 4.13.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.7
  video_player_platform_interface: 6.7.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
